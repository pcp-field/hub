name: Inject Mobile Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-course-save-v6.yml'
      - 'course-save-direct-v6.js'
      - 'file-manager-direct-v8.js'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject direct mobile scripts into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          course = '<script src="./course-save-direct-v6.js?v=20260824-1720"></script>'
          if course not in text:
              if '</body>' not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace('</body>', course + '\n</body>', 1)

          old_files = '<script src="./file-manager-direct-v7.js?v=20260824-1726"></script>'
          new_files = '<script src="./file-manager-direct-v8.js?v=20260824-1735"></script>'
          if old_files in text:
              text = text.replace(old_files, new_files, 1)
          elif new_files not in text:
              if '</body>' not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace('</body>', new_files + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use iOS-safe in-memory file sharing"
          git push