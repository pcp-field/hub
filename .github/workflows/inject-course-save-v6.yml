name: Inject Mobile Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-course-save-v6.yml'
      - 'course-save-direct-v6.js'
      - 'file-manager-direct-v8.js'
      - 'file-manager-ios-fallback-v9.js'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject direct mobile scripts into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          course = '<script src="./course-save-direct-v6.js?v=20260824-1720"></script>'
          files7 = '<script src="./file-manager-direct-v7.js?v=20260824-1726"></script>'
          files8 = '<script src="./file-manager-direct-v8.js?v=20260824-1735"></script>'
          ios9 = '<script src="./file-manager-ios-fallback-v9.js?v=20260824-1742"></script>'

          if course not in text:
              text = text.replace('</body>', course + '\n</body>', 1)
          if files7 in text:
              text = text.replace(files7, files8, 1)
          elif files8 not in text:
              text = text.replace('</body>', files8 + '\n</body>', 1)
          if ios9 not in text:
              text = text.replace('</body>', ios9 + '\n</body>', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use reliable iPhone Files sharing fallback"
          git push