name: Inject Files v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-files-v9.yml'
      - 'file-manager-ios-fallback-v9.js'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject Files v9 directly into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<script src="./file-manager-direct-v7.js?v=20260824-1726"></script>'
          v8 = '<script src="./file-manager-direct-v8.js?v=20260824-1735"></script>'
          v9 = '<script src="./file-manager-ios-fallback-v9.js?v=20260824-1752"></script>'
          if old in text:
              text = text.replace(old, v8, 1)
          if v8 not in text:
              text = text.replace('</body>', v8 + '\n</body>', 1)
          if v9 not in text:
              text = text.replace('</body>', v9 + '\n</body>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Files v9 directly from index"
          git push
